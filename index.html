<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma</title>
</head>
<body>
    <h1>Bem vindo à calculadora da IOS.</h1>

    <script>
        // solicitar o nome do usuário
        const nome = prompt("Olá, bem vindo a calculadora da IOS. Para começar, digite o seu nome:")

        // solicitar dois números para o usuário
        const numero_1 = Number(prompt("Digite o primeiro número para a soma"));

        const numero_2 = Number(prompt("Digite o segundo número para a soma"))


        // calcular a soma entre esses dois números
        const resultado = numero_1 + numero_2;

        // mostrar ao usuário o nome dele e a soma
        console.log(`Olá ${nome}, oEnzo resultado da soma entre ${numero_1} e ${numero_2} é igual a ${resultado}`)
    </script> 
</body>
</html>
