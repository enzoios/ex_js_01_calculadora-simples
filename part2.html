<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão de idade</title>
</head>
<body>
    <script>
        // pedir o nome do usuário
        const nome = prompt("Qual o seu nome completo?")

        // mensagem de alerta para dar boas vindas
        alert(`Olá ${nome}, boas vindas ao site oficial da Idade Tech. Primeiro, precisamos da sua idade.`)

        // pedir a idade do usuário
        const idade = Number(prompt("Qual a sua idade? *apenas número"))

        // mostrar quantos anos essa pessoa vai fazer em 2026
        alert(`No ano de 2026, nesse mesmo dia, você terá ${idade + 1} anos! Parabéns!`)
    </script>
</body>
</html>
